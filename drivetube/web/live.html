<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV in diretta</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0}
__NAVCSS__
main{padding:0 12px 24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0}
.bar input{flex:1;min-width:180px;font-size:18px;padding:10px;border-radius:10px;border:0;background:#222;color:#fff}
.lists{display:flex;gap:8px;flex-wrap:wrap}
.lists a,.lists a:visited{color:#fff;background:#333;text-decoration:none;padding:8px 12px;border-radius:12px;font-size:16px}
.lists a.on{background:#fff;color:#000}
h2{font-size:17px;margin:18px 0 8px}
.note{color:#aaa;font-size:14px;margin:0 0 10px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch,.ch:visited{display:flex;flex-direction:column;align-items:center;gap:8px;background:#1c1c1c;border-radius:12px;padding:12px 8px;color:#fff;text-decoration:none;text-align:center}
.ch img,.ch .ph{width:100%;height:70px;object-fit:contain}
.ch .ph{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#666}
.ch span{font-size:15px;line-height:1.25;word-break:break-word}
.ch.now{outline:3px solid #22c55e}
.geo .ch{opacity:.6}
.err{background:#3b1d1d;color:#fca5a5;padding:10px;border-radius:10px}
</style></head><body>
__NAV__
<main>
<div class="bar"><input id="f" placeholder="cerca un canale" autocomplete="off"><div class="lists">__LISTS__</div></div>
__BODY__
</main>
<script>
(function(){
  var f = document.getElementById('f');
  function run(){
    var q = f.value.trim().toLowerCase();
    var cards = document.querySelectorAll('.ch');
    for (var i = 0; i < cards.length; i++) {
      var n = cards[i].getAttribute('data-n') || '';
      cards[i].style.display = (!q || n.indexOf(q) !== -1) ? '' : 'none';
    }
  }
  f.addEventListener('input', run);
  // logo che non si carica: al suo posto le iniziali del canale
  function noLogo(img){
    var d = document.createElement('div');
    d.className = 'ph';
    d.textContent = (img.parentNode.querySelector('span') || {}).textContent.slice(0, 2).toUpperCase();
    img.parentNode.replaceChild(d, img);
  }
  var imgs = document.querySelectorAll('.ch img');
  for (var i = 0; i < imgs.length; i++) {
    (function(img){
      if (img.complete && !img.naturalWidth && img.getAttribute('src')) { noLogo(img); return; }
      img.addEventListener('error', function(){ noLogo(img); });
    })(imgs[i]);
  }
})();
</script>
</body></html>
