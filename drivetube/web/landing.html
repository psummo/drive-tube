<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0}
__NAVCSS__
main{padding:16px;max-width:1200px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

.tile i{position:absolute;top:16px;right:20px;font-style:normal;font-size:44px;opacity:.9}
.tv{background:linear-gradient(135deg,#0f766e,#134e4a)}
.yt{background:linear-gradient(135deg,#b91c1c,#7f1d1d)}
.tw{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.rai{background:linear-gradient(135deg,#0b5cad,#0a2f63)}
.kk{background:linear-gradient(135deg,#16a34a,#14532d)}
.ia{background:linear-gradient(135deg,#b45309,#78350f)}
.resume,.resume:visited{display:flex;gap:14px;align-items:center;background:#1f1f1f;border-radius:14px;padding:12px;margin-bottom:16px;color:#fff;text-decoration:none}
.resume img{width:160px;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:8px}
.resume small{display:block;color:#aaa;font-size:14px;margin-bottom:4px}
.resume b{font-size:19px}
</style></head><body>
