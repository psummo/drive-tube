<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__LABEL__</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0}
__NAVCSS__
main{padding:0 12px 24px}
form{display:flex;gap:8px;padding:12px 0}
form input{flex:1;font-size:18px;padding:10px;border-radius:10px;border:0;background:#222;color:#fff}
form button{font-size:18px;padding:10px 16px;border:0;border-radius:10px;background:__COLOR__;color:#fff}
h2{font-size:17px;margin:18px 0 8px}
.note{color:#aaa;font-size:14px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:#1c1c1c;border-radius:12px;overflow:hidden;position:relative}
.card a.go,.card a.go:visited{color:#fff;text-decoration:none;display:block}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.card .t{padding:8px 10px;font-size:15px}
.card .t b{display:block;font-size:17px}
.card .t small{color:#aaa;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badge{position:absolute;top:8px;left:8px;background:#555;color:#fff;font-size:13px;font-weight:bold;padding:3px 7px;border-radius:6px}
.card.live .badge{background:#e11d48}
.card.off img{filter:grayscale(1) brightness(.5)}
.card .x,.card .x:visited{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;text-decoration:none;width:34px;height:34px;line-height:34px;text-align:center;border-radius:17px;font-size:18px}
.vod,.vod:visited{display:flex;gap:12px;align-items:center;background:#1c1c1c;border-radius:10px;padding:10px;color:#fff;text-decoration:none;margin-bottom:8px}
.vod b{font-size:16px;font-weight:normal}
.vod small{color:#aaa;white-space:nowrap}
.btn,.btn:visited{display:inline-block;background:#e11d48;color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-size:18px;margin:4px 0 8px}
</style></head><body>
__NAV__
<main>
<form action="__PATH__"><input name="add" placeholder="aggiungi un canale (nome o link __HOST__/...)" autocomplete="off"><button>aggiungi</button></form>
__BODY__
</main>
<script>
(function(){
  var cards = document.querySelectorAll('.card[data-c]');
  if (!cards.length) return;
  fetch('__PATH__/status').then(function(r){ return r.json(); }).then(function(st){
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i], n = c.getAttribute('data-c'), s = st[n] || {};
      var b = c.querySelector('.badge'), go = c.querySelector('a.go'), sm = c.querySelector('small');
      if (s.live) {
        c.className = 'card live'; b.textContent = 'LIVE';
        go.href = '/watch?v=__LIVEKEY__.' + n;
        var im = c.querySelector('img'); if (s.thumb && im && im.getAttribute('src') !== s.thumb) im.src = s.thumb;
        if (s.title) sm.textContent = s.title;
      } else {
        c.className = 'card off'; b.textContent = 'offline';
        go.href = '__PATH__?c=' + n;
        sm.textContent = 'non in diretta: tocca per i video salvati';
      }
    }
  }).catch(function(){});
})();
</script>
</body></html>
