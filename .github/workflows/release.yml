name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile yt_mjpeg.py && python3 -m compileall -q drivetube
      - name: Package
        run: tar czf drive-tube-${{ github.ref_name }}.tar.gz yt_mjpeg.py drivetube README.md LICENSE setup.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            drive-tube-${{ github.ref_name }}.tar.gz
